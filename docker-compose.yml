version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resq_postgres
    restart: always
    environment:
      POSTGRES_DB: resq_db
      POSTGRES_USER: resq_admin
      POSTGRES_PASSWORD: resq_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq_admin -d resq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Pub/Sub Queue
  redis:
    image: redis:7-alpine
    container_name: resq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. MongoDB for Telemetry & Unstructured AI Logs
  mongodb:
    image: mongo:7.0
    container_name: resq_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resq_telemetry
    volumes:
      - mongodata:/data/db

  # 4. EMQX Enterprise MQTT Broker for IoT Sensors
  emqx:
    image: emqx/emqx:5.3.2
    container_name: resq_mqtt
    restart: always
    ports:
      - "1883:1883"    # MQTT TCP
      - "8083:8083"    # MQTT WebSocket
      - "18083:18083"  # EMQX Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "resq_mqtt_password"

  # 5. FastAPI Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://resq_admin:resq_secure_password_2026@postgres:5432/resq_db"
      REDIS_URL: "redis://redis:6379/0"
      MONGO_URL: "mongodb://mongodb:27017/resq_telemetry"
      MQTT_BROKER: "emqx"
      SECRET_KEY: "resq_jwt_super_secret_key_sih_2026_win"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 6. Next.js Glassmorphic Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resq_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  mongodata:
